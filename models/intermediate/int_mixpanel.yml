version: 2

models:
  - name: int_mixpanel__user_first_event
    description: >
      Table in which each row represents the first and last day a user performed a type of event.
      Incremental counterpart of `stg_mixpanel__user_first_event`, used by `mixpanel__monthly_events`
      so incremental runs don't re-scan all events. Full builds read all events, so `first_event_day`
      isn't affected by `date_range_start`.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - source_relation
              - people_id
              - event_type
    columns:
      - name: people_id
        description: Foreign key referencing the event's associated user's `people.distinct_id`.

      - name: event_type
        description: Name of the type of event that was logged.

      - name: first_event_day
        description: Calendar date of the first time the user performed this type of event.

      - name: last_event_day
        description: Calendar date of the most recent time the user performed this type of event. Used to set the incremental lookback window.

      - name: unique_key
        description: Unique key used for the incremental model configuration. Hashed on `people_id`, `event_type` and `source_relation`.
        data_tests:
          - unique
          - not_null

      - name: source_relation
        description: >
          The `<database>`.`<schema>` this record came from.
